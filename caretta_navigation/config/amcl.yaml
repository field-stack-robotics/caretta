# AMCL (nav2_amcl): finds the robot on a saved map with the LiDAR -> TF map -> odom.
# Based on nav2_bringup/params/nav2_params.yaml (amcl section); changed for Caretta:
#   base_frame_id, laser_min/max_range (N10), update_min_d/a (small robot, small house),
#   set_initial_pose (robot spawns at the map origin in Gazebo).
amcl:
  ros__parameters:
    # frames and topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: caretta_base_footprint
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0

    # motion model: how much the odometry can be wrong (bigger -> particles spread more)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2    # rotation error from rotation
    alpha2: 0.2    # rotation error from translation
    alpha3: 0.2    # translation error from translation
    alpha4: 0.2    # translation error from rotation
    alpha5: 0.2    # (omni robots only)

    # particles
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # update only after the robot moved this much (filter work only when it is useful)
    update_min_d: 0.1     # m
    update_min_a: 0.1     # rad

    # laser model: compares each scan with the map
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1      # m, N10
    laser_max_range: 12.0     # m, N10
    max_beams: 60             # beams used per scan (of 450): enough, and fast
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # recovery (0 = off): add random particles when the match gets bad
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # start pose: Gazebo spawns the robot at (0, 0), facing +x = the map origin of our map
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    save_pose_rate: 0.5
