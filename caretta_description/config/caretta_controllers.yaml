controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["caretta_left_wheel"]
    right_wheel_names: ["caretta_right_wheel"]

    # must match caretta.urdf.xacro
    wheel_separation: 0.2092
    wheel_radius: 0.0345
    wheels_per_side: 1

    odom_frame_id: odom
    base_frame_id: caretta_base_footprint
    publish_rate: 100.0
    enable_odom_tf: true
    open_loop: false
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # false -> listens to geometry_msgs/Twist on ~/cmd_vel_unstamped (teleop_twist_keyboard)
    use_stamped_vel: false
    cmd_vel_timeout: 0.5  # s, robot stops if no command arrives

    # conservative limits for a small indoor robot
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.3       # m/s
    linear.x.min_velocity: -0.3
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0   # m/s^2
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0      # rad/s
    angular.z.min_velocity: -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 4.0  # rad/s^2
    angular.z.min_acceleration: -4.0
